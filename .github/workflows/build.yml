name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (build-tools 34, platform 34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Ajoute le secret KEYSTORE_B64 (Settings > Secrets and variables > Actions)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore

      - name: Build
        env:
          RELEASE_KEYSTORE: release.keystore
          RELEASE_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          RELEASE_KEY_ALIAS: tvos-release
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Version X.X.XX : 3.0.99, puis 3.1.00, 3.1.01…
          export VERSION_NAME="$(printf '3.%d.%02d' $((RUN_NUMBER / 100)) $((RUN_NUMBER % 100)))"
          export VERSION_CODE=$((1000 + RUN_NUMBER))
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          bash build.sh

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" build/tvos-home.apk \
            --title "v$VERSION_NAME (mode location)" \
            --notes "Build automatique du commit ${GITHUB_SHA::7}"
